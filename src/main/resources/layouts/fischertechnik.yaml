# Fischertechnik Factory 4.0 as a timed, coloured Petri net.
#
# Sources: docs/layouts/fischertechnik/http-api.md and mqtt.md (from the lab's app.py and
# controllers). Durations are starting values from the 2021 production log until the lab
# recordings are in. Format: docs/layouts/layout-format.md.
#
# Patterns used throughout:
# - <machine>_idle holds one token while the machine is ready (current_state: ready).
# - cmd_<machine>_<task> is the controller's queue: each HTTP call puts a request token there.
#   A request waits until the machine is ready, like the physical queue (no "busy" error).
# - A task that takes several steps passes the request on as a job token (<machine>_job), so
#   later steps still see the request's parameters (${end}, ${time}).
# - The physical controllers never check for a workpiece: a task without one still runs and
#   succeeds. The *_empty transitions model that with an inhibitor arc.

id: fischertechnik
name: Fischertechnik Factory 4.0
description: >-
  Gripper, oven, transport, milling machine, sorting line and warehouse of the lab factory.
  Applications use the factory's own HTTP API (/vgr/..., /ov/..., ...) and MQTT topics
  (FTFactory/<STATION>) on this server.

# ---- shared values, referenced with *name below ----

x-positions:
  vgr-starts: &vgr_starts [delivery_pick_up_station, color_detection_delivery_pick_up_station,
                           nfc_reader_delivery_pick_up_station, oven, sink_1, sink_2, sink_3, sm_cb,
                           high_bay_warehouse, waiting_platform]
  vgr-ends: &vgr_ends [delivery_pick_up_station, color_detection_delivery_pick_up_station,
                       nfc_reader_delivery_pick_up_station, oven, sink_1, sink_2, sink_3, sm_cb,
                       high_bay_warehouse, waiting_platform, high_bay_warehouse_delivery_station]

x-errors:
  no-machine: &no_machine
    status: 404
    body: '{"error": "404 Not Found: No Machine is passed"}'
  wrong-machine: &wrong_machine
    status: 404
    body: '{"error": "404 Not Found: Please make sure that the value of the parameter for the machine is 1"}'
  unknown-position: &unknown_position
    status: 400
    body: '{"error": "400 Bad Request: The machine controller of the addressed machine encountered an error: <class ''ValueError''>:Position ${value} does not exist"}'
  no-light-barrier: &no_light_barrier
    status: 400
    body: '{"error": "400 Bad Request: The machine controller of the addressed machine encountered an error: <class ''ValueError''>:Light Barrier ${value} does not exist"}'
  not-an-integer: &not_an_integer
    status: 500
    body: '{"error": "invalid literal for int() with base 10: ''${value}''"}'
  sort-start: &sort_start
    status: 400
    body: '{"error": "400 Bad Request: The machine controller of the addressed machine encountered an error: <class ''ValueError''>:Start ${value} is not simulated (only initial)"}'
  sort-location: &sort_location
    status: 400
    body: '{"error": "400 Bad Request: The machine controller of the addressed machine encountered an error: <class ''ValueError''>:Sink ${value} is not a valid ejection position"}'
  no-motor: &no_motor
    status: 400
    body: '{"error": "400 Bad Request: The machine controller of the addressed machine encountered an error: <class ''ValueError''>:Trying to access non-existing motor ${value}"}'
  unknown-color: &unknown_color
    status: 400
    body: '{"error": "400 Bad Request: Color ${value} does not exist (white, red, blue)"}'

