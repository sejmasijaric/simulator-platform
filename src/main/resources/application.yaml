server:
  port: 8080

spring:
  application:
    name: simulation-platform
  jackson:
    serialization:
      write-durations-as-timestamps: false
  threads:
    # Layout commands block until the simulated machine is done; virtual threads keep that cheap.
    virtual:
      enabled: true

simulation:
  layouts:
    # Layouts are bundled in src/main/resources/layouts/. Set a folder here to add more without rebuilding.
    dir: ""
  events:
    mqtt:
      # Publishes the MQTT messages each layout declares (e.g. FTFactory/<STATION> twice per second).
      enabled: true
      broker-url: tcp://localhost:1883
      username: ""
      password: ""
