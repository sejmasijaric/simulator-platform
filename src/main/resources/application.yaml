server:
  port: 8080

spring:
  application:
    name: simulation-platform
  jackson:
    serialization:
      write-durations-as-timestamps: false
  threads:
    # Factory commands block until the simulated machine is done; virtual threads keep that cheap.
    virtual:
      enabled: true

simulation:
  fischertechnik:
    mqtt:
      # Status messages like the physical factory: FTFactory/<STATION>, twice per second.
      enabled: true
      broker-url: tcp://localhost:1883
      topic-prefix: FTFactory/
      interval: 500ms
