# Simulator with UI on http://localhost:8080 and an MQTT broker on localhost:1883.
#   docker compose up --build
services:
  simulator:
    build: .
    ports:
      - "8080:8080"
    environment:
      SIMULATION_EVENTS_MQTT_BROKER_URL: tcp://mosquitto:1883
    depends_on:
      - mosquitto

  # Broker for the layouts' messages: the simulator publishes e.g. the factory's status messages
  # (FTFactory/<STATION>) here; applications connect to it instead of the lab broker.
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

