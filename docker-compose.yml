# Simulator with UI on http://localhost:8080 and an MQTT broker on localhost:1883.
#   docker compose up --build                  simulator + broker
#   docker compose --profile demo up --build   also runs the demo process
services:
  simulator:
    build: .
    ports:
      - "8080:8080"
    environment:
      SIMULATION_FISCHERTECHNIK_MQTT_BROKER_URL: tcp://mosquitto:1883
    depends_on:
      - mosquitto

  # Broker for the hardware-compatible adapters: the simulator publishes the factory's status
  # messages (FTFactory/<STATION>) here; applications connect to it instead of the lab broker.
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  demo:
    profiles: ["demo"]
    image: python:3.12-alpine
    volumes:
      - ./applications/demo:/demo:ro
    command: ["python3", "-u", "/demo/demo_process.py", "--url", "http://simulator:8080"]
    depends_on:
      - simulator
